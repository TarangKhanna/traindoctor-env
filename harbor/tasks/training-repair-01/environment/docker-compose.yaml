services:
  main:
    image: ${MAIN_IMAGE_NAME}
    build:
      context: ../../../..
      dockerfile: harbor/tasks/training-repair-01/environment/Dockerfile
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes:
      - submission:/submission
      - logs:/logs
      - solution:/solution
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1073741824,mode=1777
volumes:
  submission:
  logs:
  solution:
