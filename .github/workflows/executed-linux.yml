name: executed-linux
# Manual, non-required: real multi-process Gloo jobs on a Linux runner without OS isolation.
# Results from this run are unsandboxed and never count as verified outcomes.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  executed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      TD_CI_UNSANDBOXED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu ".[dev]"
      - name: Executed tests
        run: python -m pytest -q -rs -rf -m "executed and not sweep"
