name: executed-linux
# Non-required: real multi-process Gloo jobs on a Linux runner without OS isolation.
# Runs on demand and on pushes to the p1-fixes review branch (workflow_dispatch needs the file on the default branch).
# Results from this run are unsandboxed and never count as verified outcomes.
on:
  workflow_dispatch:
  push:
    branches: [p1-fixes]
permissions:
  contents: read
jobs:
  executed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      TD_CI_UNSANDBOXED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu ".[dev]"
      - name: Executed tests
        run: |
          set +e
          python -m pytest -q -rs -rf --tb=line -m "executed and not sweep" 2>&1 | tee pytest_executed.txt
          rc=${PIPESTATUS[0]}
          summary=$(tail -n 1 pytest_executed.txt)
          failed=$(grep -E '^(FAILED|ERROR)' pytest_executed.txt | head -40 | sed 's/%/%25/g' | paste -sd '|' -)
          echo "::error title=executed-linux summary::${summary} || ${failed}"
          exit $rc
