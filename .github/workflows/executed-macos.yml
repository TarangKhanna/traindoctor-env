name: executed-macos
# Non-required: the executed launcher tests on a GitHub-hosted ephemeral macOS runner, where the sandbox-exec
# isolation profile exists. Runs on demand and on pushes to the executed-macos review branch.
on:
  workflow_dispatch:
  push:
    branches: [executed-macos]
permissions:
  contents: read
jobs:
  executed:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Sandbox availability
        run: |
          python -c "from jobs import sandbox; print('sandbox.available =', sandbox.available())"
      - name: Sandbox ladder with denials
        continue-on-error: true
        run: |
          set +e
          sudo log stream --predicate 'sender == "Sandbox"' --style compact > denials.txt 2>&1 &
          LOGPID=$!
          sleep 3
          python scripts/diag_sandbox.py > ladder.json 2> ladder.err
          sleep 3
          sudo kill $LOGPID
          cat ladder.json
          echo "--- denials"
          grep -i "deny" denials.txt | sed -E 's/^.*Sandbox: //' | sort | uniq -c | sort -rn | head -40
          python - <<'PY'
          import json
          t = open("ladder.json").read()
          e = open("ladder.err").read()[-800:]
          d = open("denials.txt").read()
          import re
          deny = sorted({re.sub(r"^.*Sandbox: ", "", l) for l in d.splitlines() if "deny" in l.lower()})
          def chunk(s, n=3000):
              return [s[i:i+n] for i in range(0, len(s), n)] or [""]
          def enc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          for i, c in enumerate(chunk(t)[:3]):
              print("::error title=ladder %d::%s" % (i, enc(c)))
          print("::error title=ladder stderr::%s" % enc(e))
          print("::error title=denials::%s" % enc("\n".join(deny)[:3500]))
          PY
      - name: Executed tests
        run: |
          set +e
          python -m pytest -q -rs -rf --tb=line -m "executed and not sweep" 2>&1 | tee pytest_executed.txt
          rc=${PIPESTATUS[0]}
          summary=$(tail -n 1 pytest_executed.txt)
          failed=$(grep -E '^(FAILED|ERROR)' pytest_executed.txt | head -40 | sed 's/%/%25/g' | paste -sd '|' -)
          avail=$(python -c "from jobs import sandbox; print(sandbox.available())")
          echo "::error title=executed-macos summary::sandbox.available=${avail} || ${summary} || ${failed}"
          exit $rc
