name: exec-diag
# Non-required: the executed launcher tests on a GitHub-hosted ephemeral macOS runner, where the sandbox-exec
# isolation profile exists. Runs on demand and on pushes to the executed-macos review branch.
on:
  workflow_dispatch:
  push:
    branches: [exec-diag]
permissions:
  contents: read
jobs:
  executed:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Sandbox availability
        run: |
          python -c "from jobs import sandbox; print('sandbox.available =', sandbox.available())"
      - name: Scenario tests in pytest, failing outcome details
        run: |
          set +e
          python -m pytest -q -l --tb=short -m "executed and not sweep" tests/test_scenarios.py tests/test_tiera.py > sc.txt 2>&1
          echo "::notice title=summary::$(tail -n 1 sc.txt)"
          grep -oE "detail='[^']{0,120}'" sc.txt | sort | uniq -c | sort -rn | head -5 | while read -r l; do echo "::notice title=detail::$l"; done
          grep -oE "relaunches=[0-9]+, sandboxed=[A-Za-z]+, exec_mode='[a-z_]+'" sc.txt | sort | uniq -c | head -4 | while read -r l; do echo "::notice title=fields::$l"; done
          grep -oE "steps_completed=[0-9]+, ckpt_valid=[A-Za-z]+, sample_gaps=[0-9]+, sample_dups=[0-9]+" sc.txt | sort | uniq -c | head -4 | while read -r l; do echo "::notice title=steps::$l"; done
      - name: Sandbox denials (last 60 min)
        if: always()
        run: |
          log show --last 60m --style compact --predicate 'sender == "Sandbox"' 2>/dev/null | grep -i deny | sed -E 's/^.{0,30}//' | sort | uniq -c | sort -rn | head -15 | while read -r l; do echo "::notice title=deny::$l"; done
