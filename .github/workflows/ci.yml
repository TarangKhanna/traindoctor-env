name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies (pins equal uv.lock)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu ".[dev]"
      - name: Unit tests (no Docker, Modal, Metal or macOS sandbox)
        run: |
          set -o pipefail
          python -m pytest -q -rs -rf --ignore=tests/test_first_update.py -m "not sweep and not executed" 2>&1 | tee pytest.log \
            || { grep -E "^(FAILED|ERROR)" pytest.log | cut -c1-400 | while read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Import smoke test of the installed package
        run: |
          cd "$RUNNER_TEMP" && python -I -c "import traindoctor_env, jobs, rl.splits; from modal_train import sandbox_backend"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (syntax errors and undefined names only)
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 .

  docs-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README numbers, links and figures match the committed results
        run: python scripts/check_readme.py
      - name: Evidence checksums
        run: |
          for f in $(git ls-files | grep -E '(^|/)SHA256SUMS$'); do
            echo "== $f"; (cd "$(dirname "$f")" && sha256sum -c SHA256SUMS)
          done
