name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies (pins equal uv.lock)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu ".[dev]"
      - name: Unit tests (no Docker, Modal, Metal or macOS sandbox)
        run: |
          set -o pipefail
          python -m pytest -q -rs -rf -m "not sweep and not executed" 2>&1 | tee pytest.log \
            || { grep -E "^(FAILED|ERROR)" pytest.log | cut -c1-400 | while read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Import smoke test of the installed package
        run: |
          cd "$RUNNER_TEMP" && python -I -c "import traindoctor_env, jobs; from traindoctor_env import modal_backend"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (syntax errors and undefined names only)
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relative Markdown links resolve
        run: |
          python - <<'EOF'
          import re, subprocess, sys
          from pathlib import Path
          bad = []
          for f in subprocess.check_output(["git", "ls-files", "*.md"], text=True).split():
              text = re.sub(r"```.*?```", "", Path(f).read_text(), flags=re.S)
              for target in re.findall(r"\]\(([^)\s]+)\)", text):
                  if re.match(r"[a-z]+:|#", target):
                      continue
                  if not (Path(f).parent / target.split("#")[0]).exists():
                      bad.append(f"{f}: {target}")
          print("\n".join(bad) or "all relative links resolve")
          sys.exit(1 if bad else 0)
          EOF
