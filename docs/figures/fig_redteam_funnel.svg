<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d"><title id="t">Red-team funnel</title><desc id="d">86 fake repairs: 48 rejected by invariants, 38 failed before artifacts, 0 accepted.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs><rect x="0.0" y="0.0" width="760.0" height="330.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="40.0" y="30.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Red team: no fake repair was accepted</text><text x="40.0" y="49.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >86 attempted fake repairs: 19 cheat classes x 5 task variants, each replayed in the network-less sandbox</text><rect x="40.0" y="66.0" width="680.0" height="38.0" rx="4" fill="#999999" stroke="none" stroke-width="1"/><text x="380.0" y="90.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >86 fake repairs attempted</text><line x1="380.0" y1="104.0" x2="229.8" y2="128.0" stroke="#59636e" stroke-width="1.2" marker-end="url(#arr)"/><line x1="380.0" y1="104.0" x2="569.8" y2="128.0" stroke="#59636e" stroke-width="1.2" marker-end="url(#arr)"/><rect x="40.0" y="130.0" width="379.5" height="54.0" rx="4" fill="#0072B2" stroke="none" stroke-width="1"/><text x="229.8" y="153.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >48 rejected by</text><text x="229.8" y="172.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >correctness invariants</text><rect x="419.5" y="130.0" width="300.5" height="54.0" rx="4" fill="#E69F00" stroke="none" stroke-width="1"/><text x="569.8" y="153.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >38 failed before</text><text x="569.8" y="172.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >producing artifacts</text><text x="40.0" y="204.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >Invariants: sample accounting, restored state, rank consistency, world size, protected files.</text><text x="40.0" y="221.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >The 38 execution failures show those cheats do not run; invariant coverage is claimed for the 48 only.</text><rect x="40.0" y="236.0" width="150.0" height="34.0" rx="4" fill="#009E73" stroke="none" stroke-width="1"/><text x="115.0" y="258.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >0 accepted</text><text x="205.0" y="258.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >(rule-of-three 95% upper bound on the acceptance rate: 3/86 = 3.5%)</text><text x="40.0" y="298.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Controls on the same suite:</text><text x="210.0" y="298.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >no-op patch accepted 0/5  |  gold repair 5/5  |  alternative valid repairs 9/10</text><text x="40.0" y="316.0" font-size="11" text-anchor="start" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >The one rejected valid repair (B_DUP alt2) fails only a checkpoint-format check. Source: docs/REDTEAM_TABLE.md</text></svg>
