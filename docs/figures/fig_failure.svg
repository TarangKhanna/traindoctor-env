<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" width="800" height="476" role="img" aria-labelledby="t d"><title id="t">Rank 2 called a different collective, so all four ranks hang</title><desc id="d">Three steps. 1: at step 6 ranks 0, 1 and 3 call all_reduce while rank 2 calls broadcast. 2: the ranks wait on each other and none can finish. 3: all four ranks exit 1 with the same COLLECTIVE_TIMEOUT error; only the per-rank trace shows who diverged.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs><rect x="0.0" y="0.0" width="800.0" height="476.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="400.0" y="40.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Rank 2 called a different collective, so all four ranks hang</text><rect x="20.0" y="70.0" width="240.0" height="308.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><circle cx="44.0" cy="96.0" r="15" fill="#1f2328"/><text x="44.0" y="102.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >1</text><rect x="280.0" y="70.0" width="240.0" height="308.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><circle cx="304.0" cy="96.0" r="15" fill="#1f2328"/><text x="304.0" y="102.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >2</text><rect x="540.0" y="70.0" width="240.0" height="308.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><circle cx="564.0" cy="96.0" r="15" fill="#1f2328"/><text x="564.0" y="102.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >3</text><line x1="261.0" y1="215.0" x2="268.0" y2="215.0" stroke="#1f2328" stroke-width="2.5"/><polygon points="279.0,215.0 268.0,221.0 268.0,209.0" fill="#1f2328"/><line x1="521.0" y1="215.0" x2="528.0" y2="215.0" stroke="#1f2328" stroke-width="2.5"/><polygon points="539.0,215.0 528.0,221.0 528.0,209.0" fill="#1f2328"/><text x="68.0" y="102.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Step 6, call #12</text><rect x="34.0" y="126.0" width="212.0" height="44.0" rx="8" fill="#0072B2" stroke="none" stroke-width="1"/><text x="48.0" y="154.0" font-size="16" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >rank 0</text><text x="232.0" y="154.0" font-size="16" text-anchor="end" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >all_reduce</text><rect x="34.0" y="184.0" width="212.0" height="44.0" rx="8" fill="#0072B2" stroke="none" stroke-width="1"/><text x="48.0" y="212.0" font-size="16" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >rank 1</text><text x="232.0" y="212.0" font-size="16" text-anchor="end" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >all_reduce</text><rect x="34.0" y="242.0" width="212.0" height="44.0" rx="8" fill="#E69F00" stroke="none" stroke-width="1"/><text x="48.0" y="270.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >rank 2</text><text x="232.0" y="270.0" font-size="16" text-anchor="end" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >broadcast</text><rect x="34.0" y="300.0" width="212.0" height="44.0" rx="8" fill="#0072B2" stroke="none" stroke-width="1"/><text x="48.0" y="328.0" font-size="16" text-anchor="start" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >rank 3</text><text x="232.0" y="328.0" font-size="16" text-anchor="end" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >all_reduce</text><text x="140.0" y="366.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#8a5a00" font-family="Helvetica, Arial, sans-serif" >Only rank 2 differs</text><text x="328.0" y="102.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Deadlock</text><rect x="430.0" y="168.0" width="76.0" height="90.0" rx="8" fill="#E69F00" stroke="none" stroke-width="1"/><text x="468.0" y="218.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >rank 2</text><rect x="294.0" y="130.0" width="76.0" height="44.0" rx="8" fill="#0072B2" stroke="none" stroke-width="1"/><text x="332.0" y="158.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >rank 0</text><line x1="381.7" y1="158.8" x2="419.3" y2="188.2" stroke="#59636e" stroke-width="2"/><polygon points="428.0,195.0 415.6,193.0 423.0,183.5" fill="#59636e"/><polygon points="373.0,152.0 385.4,154.0 378.0,163.5" fill="#59636e"/><rect x="294.0" y="194.0" width="76.0" height="44.0" rx="8" fill="#0072B2" stroke="none" stroke-width="1"/><text x="332.0" y="222.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >rank 1</text><line x1="384.0" y1="215.4" x2="417.0" y2="213.6" stroke="#59636e" stroke-width="2"/><polygon points="428.0,213.0 417.3,219.6 416.7,207.6" fill="#59636e"/><polygon points="373.0,216.0 383.7,209.4 384.3,221.4" fill="#59636e"/><rect x="294.0" y="258.0" width="76.0" height="44.0" rx="8" fill="#0072B2" stroke="none" stroke-width="1"/><text x="332.0" y="286.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >rank 3</text><line x1="381.2" y1="272.7" x2="419.8" y2="238.3" stroke="#59636e" stroke-width="2"/><polygon points="428.0,231.0 423.8,242.8 415.8,233.8" fill="#59636e"/><polygon points="373.0,280.0 377.2,268.2 385.2,277.2" fill="#59636e"/><text x="400.0" y="326.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >each waits for the others</text><text x="400.0" y="354.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#D55E00" font-family="Helvetica, Arial, sans-serif" >nobody can finish</text><text x="588.0" y="102.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Timeout</text><rect x="554.0" y="124.0" width="100.0" height="50.0" rx="8" fill="#D55E00" stroke="none" stroke-width="1"/><text x="604.0" y="145.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >rank 0</text><text x="604.0" y="165.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >exit 1</text><rect x="662.0" y="124.0" width="100.0" height="50.0" rx="8" fill="#D55E00" stroke="none" stroke-width="1"/><text x="712.0" y="145.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >rank 1</text><text x="712.0" y="165.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >exit 1</text><rect x="554.0" y="186.0" width="100.0" height="50.0" rx="8" fill="#D55E00" stroke="none" stroke-width="1"/><text x="604.0" y="207.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >rank 2</text><text x="604.0" y="227.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >exit 1</text><rect x="662.0" y="186.0" width="100.0" height="50.0" rx="8" fill="#D55E00" stroke="none" stroke-width="1"/><text x="712.0" y="207.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >rank 3</text><text x="712.0" y="227.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >exit 1</text><text x="660.0" y="288.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >same error on every rank:</text><text x="660.0" y="316.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#D55E00" font-family="Helvetica, Arial, sans-serif" >COLLECTIVE_TIMEOUT</text><text x="660.0" y="342.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >(job fails)</text><rect x="20.0" y="392.0" width="760.0" height="62.0" rx="10" fill="#fff4e5" stroke="#E69F00" stroke-width="2"/><text x="400.0" y="430.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >The error never names rank 2. Only the per-rank trace shows who diverged.</text></svg>
