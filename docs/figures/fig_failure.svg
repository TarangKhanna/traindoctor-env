<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d"><title id="t">The failure: a diverging collective</title><desc id="d">Ranks 0, 1 and 3 call all_reduce while rank 2 calls broadcast; all ranks time out with the same error.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs><rect x="0.0" y="0.0" width="760.0" height="330.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="380.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >The failure: one rank takes a different branch, so everyone times out</text><text x="380.0" y="48.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >4-rank job, step 6, collective #12 (quickstart scenario, seed 123, Task A1). Schematic of the recorded trace.</text><rect x="25.0" y="70.0" width="140.0" height="34.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="95.0" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >rank 0</text><line x1="95.0" y1="104.0" x2="95.0" y2="126.0" stroke="#d0d7de" stroke-width="2"/><line x1="95.0" y1="162.0" x2="95.0" y2="170.0" stroke="#d0d7de" stroke-width="2"/><rect x="33.0" y="126.0" width="124.0" height="36.0" rx="6" fill="#0072B2" stroke="none" stroke-width="1"/><text x="95.0" y="149.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >all_reduce</text><rect x="215.0" y="70.0" width="140.0" height="34.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="285.0" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >rank 1</text><line x1="285.0" y1="104.0" x2="285.0" y2="126.0" stroke="#d0d7de" stroke-width="2"/><line x1="285.0" y1="162.0" x2="285.0" y2="170.0" stroke="#d0d7de" stroke-width="2"/><rect x="223.0" y="126.0" width="124.0" height="36.0" rx="6" fill="#0072B2" stroke="none" stroke-width="1"/><text x="285.0" y="149.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >all_reduce</text><rect x="405.0" y="70.0" width="140.0" height="34.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="475.0" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >rank 2</text><line x1="475.0" y1="104.0" x2="475.0" y2="126.0" stroke="#d0d7de" stroke-width="2"/><line x1="475.0" y1="162.0" x2="475.0" y2="170.0" stroke="#d0d7de" stroke-width="2"/><rect x="413.0" y="126.0" width="124.0" height="36.0" rx="6" fill="#D55E00" stroke="none" stroke-width="1"/><text x="475.0" y="149.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >broadcast</text><rect x="595.0" y="70.0" width="140.0" height="34.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="665.0" y="92.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >rank 3</text><line x1="665.0" y1="104.0" x2="665.0" y2="126.0" stroke="#d0d7de" stroke-width="2"/><line x1="665.0" y1="162.0" x2="665.0" y2="170.0" stroke="#d0d7de" stroke-width="2"/><rect x="603.0" y="126.0" width="124.0" height="36.0" rx="6" fill="#0072B2" stroke="none" stroke-width="1"/><text x="665.0" y="149.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" >all_reduce</text><text x="475.0" y="182.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#D55E00" font-family="Helvetica, Arial, sans-serif" >enters a different collective</text><text x="95.0" y="182.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >waits for its peers</text><text x="285.0" y="182.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >waits for its peers</text><text x="665.0" y="182.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >waits for its peers</text><rect x="60.0" y="212.0" width="640.0" height="52.0" rx="6" fill="#fff4e5" stroke="#E69F00" stroke-width="1"/><text x="380.0" y="234.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >all_reduce never completes; the watchdog fires after the timeout</text><text x="380.0" y="253.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >Every rank reports the same COLLECTIVE_TIMEOUT. Only the per-rank collective trace shows who diverged.</text><line x1="380.0" y1="266.0" x2="380.0" y2="292.0" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arr)"/><text x="380.0" y="314.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#D55E00" font-family="Helvetica, Arial, sans-serif" >Job fails: exit 1 on all ranks</text></svg>
