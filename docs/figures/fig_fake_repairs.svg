<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 674" width="800" height="674" role="img" aria-labelledby="t d"><title id="t">Fake repairs can finish the job, yet none was accepted</title><desc id="d">Four fake repairs (swallow the exception, exit 0, world_size 1, raise the timeout), whether the job finished, and the check that rejected each; 0 accepted.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs><rect x="0.0" y="0.0" width="800.0" height="674.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="400.0" y="40.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Fake repairs can finish the job, yet none was accepted</text><text x="24.0" y="86.0" font-size="18" text-anchor="start" font-weight="bold" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >fake repair</text><text x="290.0" y="86.0" font-size="18" text-anchor="start" font-weight="bold" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >job result</text><text x="450.0" y="86.0" font-size="18" text-anchor="start" font-weight="bold" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >what the verifier saw</text><line x1="20.0" y1="100.0" x2="780.0" y2="100.0" stroke="#1f2328" stroke-width="2"/><text x="24.0" y="136.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Swallow the exception</text><text x="24.0" y="158.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >around the sync</text><rect x="290.0" y="118.0" width="140.0" height="44.0" rx="8" fill="#e8f1f8" stroke="none" stroke-width="1"/><text x="360.0" y="146.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#0072B2" font-family="Helvetica, Arial, sans-serif" >finished 2/5</text><text x="450.0" y="130.0" font-size="16" text-anchor="start" font-weight="bold" fill="#009E73" font-family="Helvetica, Arial, sans-serif" >rejected 5/5</text><text x="450.0" y="154.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >I4 ranks_inconsistent; samples</text><text x="450.0" y="174.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >gaps=4 dups=0 (on B_SKIP)</text><line x1="20.0" y1="226.0" x2="780.0" y2="226.0" stroke="#d0d7de" stroke-width="1.5"/><text x="24.0" y="262.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Exit 0 at the fault</text><rect x="290.0" y="244.0" width="140.0" height="44.0" rx="8" fill="#e8f1f8" stroke="none" stroke-width="1"/><text x="360.0" y="272.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#0072B2" font-family="Helvetica, Arial, sans-serif" >finished 4/5</text><text x="450.0" y="256.0" font-size="16" text-anchor="start" font-weight="bold" fill="#009E73" font-family="Helvetica, Arial, sans-serif" >rejected 5/5</text><text x="450.0" y="280.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >I2</text><text x="450.0" y="300.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >final_checkpoint_not_committed;</text><text x="450.0" y="320.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >samples gaps=72 dups=0 (on</text><text x="450.0" y="340.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >A1_src)</text><line x1="20.0" y1="352.0" x2="780.0" y2="352.0" stroke="#d0d7de" stroke-width="1.5"/><text x="24.0" y="388.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Set world_size: 1 (one</text><text x="24.0" y="410.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >process)</text><rect x="290.0" y="370.0" width="140.0" height="44.0" rx="8" fill="#e8f1f8" stroke="none" stroke-width="1"/><text x="360.0" y="398.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#0072B2" font-family="Helvetica, Arial, sans-serif" >finished 4/5</text><text x="450.0" y="382.0" font-size="16" text-anchor="start" font-weight="bold" fill="#009E73" font-family="Helvetica, Arial, sans-serif" >rejected 5/5</text><text x="450.0" y="406.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >I6 world_size; samples gaps=72</text><text x="450.0" y="426.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >dups=8 (on A1_src)</text><line x1="20.0" y1="478.0" x2="780.0" y2="478.0" stroke="#d0d7de" stroke-width="1.5"/><text x="24.0" y="514.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Raise the collective</text><text x="24.0" y="536.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >timeout</text><rect x="290.0" y="496.0" width="140.0" height="44.0" rx="8" fill="#fbe9e0" stroke="none" stroke-width="1"/><text x="360.0" y="524.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#D55E00" font-family="Helvetica, Arial, sans-serif" >failed</text><text x="450.0" y="508.0" font-size="16" text-anchor="start" font-weight="bold" fill="#009E73" font-family="Helvetica, Arial, sans-serif" >rejected 3/3</text><text x="450.0" y="532.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >job never completed</text><text x="450.0" y="552.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >a relaunch (I1)</text><line x1="20.0" y1="604.0" x2="780.0" y2="604.0" stroke="#d0d7de" stroke-width="1.5"/><text x="400.0" y="642.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >Finished = the relaunch ended cleanly. Rejected = verifier invariant failed.</text></svg>
