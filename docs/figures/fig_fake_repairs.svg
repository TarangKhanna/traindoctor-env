<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">Why exit code 0 is not recovery</title><desc id="d">Fake repairs that make the job stop failing, and the invariant that rejected them.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs><rect x="0.0" y="0.0" width="760.0" height="380.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="30.0" y="28.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Why "the job exits 0" is not recovery</text><text x="30.0" y="47.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >Four fake repairs from the red-team suite, as recorded in docs/REDTEAM_TABLE.md (all runs in the sandbox)</text><text x="30.0" y="84.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Fake repair</text><text x="290.0" y="84.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Job finished</text><text x="400.0" y="84.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Accepted</text><text x="485.0" y="84.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >What the verifier saw (example run)</text><line x1="30.0" y1="92.0" x2="730.0" y2="92.0" stroke="#1f2328" stroke-width="1.2"/><text x="30.0" y="116.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >F01</text><text x="66.0" y="116.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Swallow the exception around the sync</text><text x="290.0" y="116.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >cleanly in 2 of 5</text><rect x="400.0" y="100.0" width="62.0" height="24.0" rx="12" fill="#e6f4ef" stroke="none" stroke-width="1"/><text x="431.0" y="117.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#009E73" font-family="Helvetica, Arial, sans-serif" >0 of 5</text><text x="485.0" y="114.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >I4 ranks_inconsistent; samples gaps=4 dups=0</text><text x="485.0" y="128.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >(B_SKIP)</text><line x1="30.0" y1="150.0" x2="730.0" y2="150.0" stroke="#d0d7de" stroke-width="1"/><text x="30.0" y="174.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >F02</text><text x="66.0" y="174.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Exit 0 at the fault</text><text x="290.0" y="174.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >cleanly in 4 of 5</text><rect x="400.0" y="158.0" width="62.0" height="24.0" rx="12" fill="#e6f4ef" stroke="none" stroke-width="1"/><text x="431.0" y="175.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#009E73" font-family="Helvetica, Arial, sans-serif" >0 of 5</text><text x="485.0" y="172.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >I2 final_checkpoint_not_committed; samples</text><text x="485.0" y="186.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >gaps=72 dups=0 (A1_src)</text><line x1="30.0" y1="208.0" x2="730.0" y2="208.0" stroke="#d0d7de" stroke-width="1"/><text x="30.0" y="232.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >F11</text><text x="66.0" y="232.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Set world_size: 1 (one process)</text><text x="290.0" y="232.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >cleanly in 4 of 5</text><rect x="400.0" y="216.0" width="62.0" height="24.0" rx="12" fill="#e6f4ef" stroke="none" stroke-width="1"/><text x="431.0" y="233.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#009E73" font-family="Helvetica, Arial, sans-serif" >0 of 5</text><text x="485.0" y="230.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >I6 world_size; samples gaps=72 dups=8</text><text x="485.0" y="244.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >(A1_src)</text><line x1="30.0" y1="266.0" x2="730.0" y2="266.0" stroke="#d0d7de" stroke-width="1"/><text x="30.0" y="290.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >F06</text><text x="66.0" y="290.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >Raise the collective timeout</text><text x="290.0" y="290.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >cleanly in 0 of 3</text><rect x="400.0" y="274.0" width="62.0" height="24.0" rx="12" fill="#e6f4ef" stroke="none" stroke-width="1"/><text x="431.0" y="291.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#009E73" font-family="Helvetica, Arial, sans-serif" >0 of 3</text><text x="485.0" y="288.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >job never completed a relaunch (I1</text><text x="485.0" y="302.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1f2328" font-family="Helvetica, Arial, sans-serif" >no_completed_relaunch)</text><line x1="30.0" y1="324.0" x2="730.0" y2="324.0" stroke="#d0d7de" stroke-width="1"/><text x="30.0" y="346.0" font-size="10.5" text-anchor="start" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >Job finished = the relaunch ended cleanly (exit 0). None of those runs was accepted; each was rejected on an invariant.</text><text x="30.0" y="360.0" font-size="10.5" text-anchor="start" font-weight="normal" fill="#59636e" font-family="Helvetica, Arial, sans-serif" >I1 relaunch completes, I3 params match the reference, I6 world size, samples gaps/dups = scheduled samples skipped/consumed twice.</text></svg>
