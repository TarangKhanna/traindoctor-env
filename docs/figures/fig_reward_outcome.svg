<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="title desc">
<title id="title">Stronger reward improved full task success but not working repair selection</title>
<desc id="desc">On four faulted kinds in a held-out test, GRPO with diagnosis-only reward achieved 23.0 percent full-task success and GRPO with a stronger recovery-aware reward achieved 33.4 percent. Both policies selected a working repair at nearly the same rate, 71.4 and 71.5 percent.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}.bg{fill:#f6f8fa}.ink{fill:#1f2328}.sub{fill:#59636e}.grid{stroke:#b8c0c9}.orange{fill:#b86e00}.green{fill:#16854e}.box{fill:#fff;stroke:#c0c8d0}
@media(prefers-color-scheme:dark){.bg{fill:#0d1117}.ink{fill:#e6edf3}.sub{fill:#a7b0bc}.grid{stroke:#697580}.orange{fill:#f0ad4e}.green{fill:#49c787}.box{fill:#161b22;stroke:#6e7681}}
</style>
<rect class="bg" width="560" height="480" rx="12"/>
<rect class="box" x="12" y="12" width="536" height="208" rx="10"/>
<text class="ink" x="28" y="44" font-size="24" font-weight="700">Full-task success</text>
<text class="sub" x="28" y="70" font-size="17">Diagnosis + evidence + sandbox-verified repair</text>
<text class="sub" x="28" y="112" font-size="19">Diagnosis-only reward</text>
<rect class="orange" x="28" y="122" width="116" height="22" rx="3"/>
<text class="ink" x="154" y="140" font-size="20" font-weight="700">23.0%</text>
<text class="sub" x="28" y="179" font-size="19">Stronger recovery-aware reward</text>
<rect class="green" x="28" y="188" width="167" height="22" rx="3"/>
<text class="ink" x="205" y="206" font-size="20" font-weight="700">33.4%</text>
<rect class="box" x="12" y="234" width="536" height="196" rx="10"/>
<text class="ink" x="28" y="266" font-size="24" font-weight="700">Selected a working repair</text>
<text class="sub" x="28" y="291" font-size="17">Evidence citations do not affect this metric</text>
<text class="sub" x="28" y="332" font-size="19">Diagnosis-only reward</text>
<rect class="orange" x="28" y="343" width="357" height="18" rx="3"/>
<text class="ink" x="395" y="359" font-size="20" font-weight="700">71.4%</text>
<text class="sub" x="28" y="386" font-size="19">Stronger reward</text>
<rect class="green" x="28" y="393" width="358" height="18" rx="3"/>
<text class="ink" x="396" y="409" font-size="20" font-weight="700">71.5%</text>
<text class="sub" x="280" y="460" font-size="17" text-anchor="middle">Six paired GRPO seeds · same held-out task types · exploratory</text>
</svg>
